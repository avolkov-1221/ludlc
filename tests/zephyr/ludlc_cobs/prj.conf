CONFIG_ZTEST=y

CONFIG_LUDLC=y

# The checksum the cases frame against. The stuffing itself is header-only
# and always built: a link picks it when it is opened, not the build.
CONFIG_CRC=y

# Wide enough to reach the lengths where a COBS group fills up, which is where
# the two implementations of this format could differ without anything else
# noticing.
CONFIG_LUDLC_PAYLOAD_BITS=16
CONFIG_LUDLC_MAX_PAYLOAD_SIZE=2048

# Preallocate the framing state so the cases run with no heap at all, like an
# embedded port would. Four is more than any case holds of one framing.
CONFIG_LUDLC_STATIC_FRAMING_NUM=4

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
