tests:
  modules.ludlc.framing:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    tags:
      - ludlc
      - framing

  # A frame is as long as the network says, not as long as a framing can hold:
  # nothing here gathers one, so a megabyte through the same header must cost
  # the same staging buffer as eight octets do.
  modules.ludlc.framing.big_frames:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_LUDLC_PAYLOAD_BITS=32
      - CONFIG_LUDLC_FRAME_BITS=32
      - CONFIG_LUDLC_MAX_PAYLOAD_SIZE=1048576
    tags:
      - ludlc
      - framing
