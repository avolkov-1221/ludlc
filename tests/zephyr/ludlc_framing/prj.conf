CONFIG_ZTEST=y

CONFIG_LUDLC=y

# The checksum the cases frame against. Nothing here names a framing: which
# one a link runs is settled per connection, at the point it is opened, and
# every framing this build carries is exercised from the one binary.
CONFIG_CRC=y

# Wide enough to reach the lengths where a stuffing group fills up, which is
# where the framing and the buffer encoder could part company without anything
# else noticing.
CONFIG_LUDLC_PAYLOAD_BITS=16
CONFIG_LUDLC_MAX_PAYLOAD_SIZE=2048

# Preallocate the framing state so the cases run with no heap at all, like an
# embedded port would. Four is more than any case holds of one framing.
CONFIG_LUDLC_STATIC_FRAMING_NUM=4

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
