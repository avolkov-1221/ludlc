description: |
  A LuDLC link on the serial line between this system and its peer, described
  as a device on the UART that carries it. The line settings are the UART's
  own, current-speed and the rest; what the link runs comes from
  ludlc,link-common.yaml. A Linux peer describes its end of the same link
  with ludlc,serdev.

  Example:

    &usart1 {
        status = "okay";
        current-speed = <921600>;

        ludlc-link {
            compatible = "ludlc,uart";
            ludlc,framing = "hdlc";
            ludlc,csum = "crc16-ccitt-pr0";
            ludlc,max-payload = <32>;
        };
    };

compatible: "ludlc,uart"

include:
  - name: uart-device.yaml
  - name: ludlc,link-common.yaml
    property-blocklist:
      - ludlc,framing

properties:
  ludlc,framing:
    type: string
    enum:
      - "cobs"
      - "hdlc"
    default: "hdlc"
    description: |
      How a frame is delimited on the wire. Both ends must agree. A UART does
      not mark where a frame ends, so the framing has to, and raw cannot be
      used here.
