# @file ludlc,uart.yaml
#
# @brief Devicetree binding of a LuDLC link on a UART.
#
# @copyright
# Copyright (C) 2025-2026 Andrey VOLKOV <andrey@volkov.fr> & LuDLC Contributors

description: |
  A LuDLC link on the serial line between this system and its peer, described
  as a device on the UART that carries it. The line settings are the UART's
  own, current-speed and the rest; what the link runs comes from
  ludlc,link-common.yaml. A Linux peer describes its end of the same link
  with ludlc,serdev.

  An application opens the link with the arguments LUDLC_UART_ARGS_DT()
  from ludlc_dt.h builds, and the serial transport is on by default while
  such a node is enabled.

  Example:

    &usart1 {
        status = "okay";
        current-speed = <921600>;

        ludlc-link {
            compatible = "ludlc,uart";
            ludlc,framing = "hdlc";
            ludlc,csum = "crc16-ccitt-pr0";
            ludlc,max-payload = <32>;
        };
    };

compatible: "ludlc,uart"

include:
  - name: uart-device.yaml
  - name: ludlc,link-common.yaml
    property-blocklist:
      - ludlc,framing

properties:
  ludlc,framing:
    type: string
    enum:
      - "cobs"
      - "hdlc"
    default: "hdlc"
    description: |
      How a frame is delimited on the wire. Both ends must agree. A UART does
      not mark where a frame ends, so the framing has to, and raw cannot be
      used here.

  ludlc,rx-thread-priority:
    type: int
    default: 7
    description: |
      The Zephyr priority of the thread that receives on this link, negative
      for a cooperative one. The thread has to run before the receive
      buffers fill up, CONFIG_LUDLC_NUM_RX_BUFFERS frames, so it belongs
      above the threads that produce or consume the traffic. With
      CONFIG_LUDLC_SERIAL_SINGLE_THREAD the link has no receive thread and
      this is not used.

  ludlc,tx-thread-priority:
    type: int
    default: 7
    description: |
      The Zephyr priority of the thread that transmits on this link, or of
      its only thread with CONFIG_LUDLC_SERIAL_SINGLE_THREAD. Negative for a
      cooperative one.
