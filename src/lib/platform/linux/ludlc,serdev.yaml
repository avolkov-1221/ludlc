%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/ludlc,serdev.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LuDLC link over a UART

maintainers:
  - Andrey VOLKOV <andrey@volkov.fr>

description:
  A LuDLC link on the serial line between this system and a coprocessor,
  described as a client of the UART that carries it. What the link runs and
  the devices on it are described in ludlc,link-common.yaml.

allOf:
  - $ref: /schemas/bus/ludlc,link-common.yaml#
  - $ref: /schemas/serial/serial-peripheral-props.yaml#

properties:
  compatible:
    const: ludlc,serdev

  ludlc,framing:
    enum: [cobs, hdlc]
    default: hdlc
    description:
      A UART does not mark where a frame ends, so the framing has to, and raw
      cannot be used here.

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    serial {
        coprocessor {
            compatible = "ludlc,serdev";
            current-speed = <921600>;
            ludlc,framing = "hdlc";
            ludlc,csum = "crc16-x25-pr1";
            ludlc,max-payload = <32>;

            #address-cells = <1>;
            #size-cells = <0>;

            led-controller@1 {
                compatible = "vendor,coproc-leds";
                reg = <1>;
            };

            watchdog@2 {
                compatible = "vendor,coproc-wdt";
                reg = <2>;
            };
        };
    };
