# @file nucleo_g0b1re.conf
#
# @brief Kconfig fragment for the echo sample as an SPI peripheral on a Nucleo
# G0B1RE.
#
# @copyright
# Copyright (C) 2025-2026 Andrey VOLKOV <andrey@volkov.fr> & LuDLC Contributors
#
# @details
# Merged after prj.conf, which puts the link on a UART: the serial transport is
# turned back off here, and the SPI one, the STM32 SPI driver and the UART
# console on.

CONFIG_LUDLC_SERIAL_CONN=n
CONFIG_LUDLC_STATIC_SERIAL_CONN=n

CONFIG_LUDLC_SPI_CONN=y
CONFIG_LUDLC_STATIC_SPI_CONN=y
CONFIG_LUDLC_ECHO_SPI=y

CONFIG_SPI=y
# Without this the driver spins on the status register waiting for the
# controller to clock, which for a peripheral is the whole of its idle time.
CONFIG_SPI_STM32_INTERRUPT=y

# usart2 is wired to the ST-LINK's virtual COM port and no longer carries the
# link, so it can carry the log instead.
CONFIG_UART_CONSOLE=y
